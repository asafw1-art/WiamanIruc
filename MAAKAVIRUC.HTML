<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Hosting Manager</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2c7be5">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { font-family: Arial; direction: rtl; margin:20px; background:#f4f6f8; }
.section { background:white; padding:15px; margin-bottom:20px; border-radius:10px; box-shadow:0 2px 5px rgba(0,0,0,0.1);}
input,textarea,select,button { width:100%; margin:5px 0; padding:8px; }
button { background:#2c7be5; color:white; border:none; border-radius:5px; cursor:pointer; }
button:hover { background:#1a68d1; }
canvas { max-height:300px; }
.search-results { background:#eee; padding:10px; margin-top:5px; }
</style>
</head>

<body>

<h1>ניהול ידע חברתי</h1>

<div class="section">
<h2>➕ הוספת אורח</h2>
<input id="guestName" placeholder="שם">
<button onclick="addGuest()">הוסף</button>
<div id="guestList"></div>
</div>

<div class="section">
<h2>📅 אירוע חדש</h2>
<input type="date" id="eventDate">
<select id="mealType">
<option>בשרי</option>
<option>חלבי</option>
<option>צמחוני</option>
<option>אחר</option>
</select>
<div id="guestCheckboxes"></div>
<textarea id="menu" placeholder="תפריט"></textarea>
<button onclick="addEvent()">שמור</button>
</div>

<div class="section">
<h2>🔍 חיפוש חכם</h2>
<input id="searchInput" placeholder="חפש למשל: יואב בשרי 2024">
<button onclick="smartSearch()">חפש</button>
<div id="searchResults" class="search-results"></div>
</div>

<div class="section">
<h2>📊 Dashboard</h2>
<canvas id="mealChart"></canvas>
<canvas id="guestChart"></canvas>
</div>

<div class="section">
<h2>🤝 מי היה עם מי</h2>
<div id="coGuests"></div>
</div>

<div class="section">
<h2>🌐 מפת קשרים</h2>
<canvas id="networkCanvas"></canvas>
</div>

<div class="section">
<h2>📤 ייצוא</h2>
<button onclick="exportCSV()">ייצוא אירועים ל-CSV</button>
</div>

<script>
let guests = JSON.parse(localStorage.getItem("guests")) || [];
let events = JSON.parse(localStorage.getItem("events")) || [];

function save(){ 
 localStorage.setItem("guests",JSON.stringify(guests));
 localStorage.setItem("events",JSON.stringify(events));
}

function addGuest(){
 let name=document.getElementById("guestName").value.trim();
 if(!name)return;
 guests.push({id:Date.now(),name});
 document.getElementById("guestName").value="";
 save(); render();
}

function addEvent(){
 let date=eventDate.value;
 let meal=mealType.value;
 let menu=document.getElementById("menu").value;
 let selected=[...document.querySelectorAll("input[name=guest]:checked")].map(c=>parseInt(c.value));
 if(!date||selected.length===0)return;
 events.push({id:Date.now(),date,meal,menu,guests:selected});
 save(); render();
}

function renderGuests(){
 guestList.innerHTML=guests.map(g=>g.name).join("<br>");
 guestCheckboxes.innerHTML=guests.map(g=>
 `<label><input type=checkbox name=guest value=${g.id}> ${g.name}</label><br>`
 ).join("");
}

function buildCharts(){
 let mealCount={};
 events.forEach(e=>mealCount[e.meal]=(mealCount[e.meal]||0)+1);

 new Chart(mealChart,{
 type:'bar',
 data:{labels:Object.keys(mealCount),
 datasets:[{label:"סוגי ארוחות",data:Object.values(mealCount)}]}
 });

 let guestCount={};
 events.forEach(e=>{
   e.guests.forEach(g=>guestCount[g]=(guestCount[g]||0)+1);
 });

 new Chart(guestChart,{
 type:'bar',
 data:{labels:Object.keys(guestCount).map(id=>guests.find(g=>g.id==id)?.name),
 datasets:[{label:"ביקורים",data:Object.values(guestCount)}]}
 });
}

function calculateCoGuests(){
 let pairs={};
 events.forEach(e=>{
  for(let i=0;i<e.guests.length;i++){
   for(let j=i+1;j<e.guests.length;j++){
    let key=[e.guests[i],e.guests[j]].sort().join("-");
    pairs[key]=(pairs[key]||0)+1;
   }
  }
 });
 coGuests.innerHTML=Object.entries(pairs).map(([k,v])=>{
   let [a,b]=k.split("-");
   let nameA=guests.find(g=>g.id==a)?.name;
   let nameB=guests.find(g=>g.id==b)?.name;
   return `${nameA} & ${nameB} — ${v} פעמים`;
 }).join("<br>");
 return pairs;
}

function drawNetwork(){
 let canvas=document.getElementById("networkCanvas");
 let ctx=canvas.getContext("2d");
 canvas.width=400; canvas.height=400;
 ctx.clearRect(0,0,400,400);

 let centerX=200, centerY=200, radius=150;
 let angleStep=2*Math.PI/guests.length;

 let positions={};
 guests.forEach((g,i)=>{
   let angle=i*angleStep;
   let x=centerX+radius*Math.cos(angle);
   let y=centerY+radius*Math.sin(angle);
   positions[g.id]={x,y};
   ctx.beginPath();
   ctx.arc(x,y,15,0,2*Math.PI);
   ctx.fillStyle="#2c7be5";
   ctx.fill();
   ctx.fillStyle="white";
   ctx.fillText(g.name,x-10,y+5);
 });

 let pairs=calculateCoGuests();
 Object.entries(pairs).forEach(([k,v])=>{
   let [a,b]=k.split("-");
   ctx.beginPath();
   ctx.moveTo(positions[a].x,positions[a].y);
   ctx.lineTo(positions[b].x,positions[b].y);
   ctx.strokeStyle="rgba(0,0,0,0.3)";
   ctx.lineWidth=v;
   ctx.stroke();
 });
}

function smartSearch(){
 let q=searchInput.value.toLowerCase();
 let results=events.filter(e=>
   e.meal.toLowerCase().includes(q) ||
   e.menu.toLowerCase().includes(q) ||
   guests.some(g=>e.guests.includes(g.id)&&g.name.toLowerCase().includes(q))
 );
 searchResults.innerHTML=results.map(r=>`${r.date} | ${r.meal}`).join("<br>");
}

function exportCSV(){
 let rows=["date,meal,guests,menu"];
 events.forEach(e=>{
   let names=e.guests.map(id=>guests.find(g=>g.id==id)?.name).join("|");
   rows.push(`${e.date},${e.meal},"${names}","${e.menu}"`);
 });
 let blob=new Blob([rows.join("\n")],{type:"text/csv"});
 let a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="events.csv";
 a.click();
}

function render(){
 renderGuests();
 buildCharts();
 calculateCoGuests();
 drawNetwork();
}

render();

if("serviceWorker" in navigator){
 navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
